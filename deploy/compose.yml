# Postgres, the API and the standalone worker from one image. From the repository root:
#   cp deploy/.env.example deploy/.env   (then fill it in)
#   docker compose -f deploy/compose.yml up -d --build
# TLS terminates in front of the API (a proxy or load balancer you run); none is included here.
name: agir

# Both processes get the same settings: the same database, the same signing secret and,
# above all, the same blob store. A worker on another store would fail on every document.
x-agir-env: &agir-env
  AGIR_ENV: production
  AGIR_BIND: 0.0.0.0
  AGIR_DATA_DIR: /data
  DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in deploy/.env}
  AGIR_RUN_SIGNING_SECRET: ${AGIR_RUN_SIGNING_SECRET:?set AGIR_RUN_SIGNING_SECRET in deploy/.env}
  AGIR_PUBLIC_ORIGIN: ${AGIR_PUBLIC_ORIGIN:?set AGIR_PUBLIC_ORIGIN in deploy/.env}
  AGIR_TRUST_PROXY: ${AGIR_TRUST_PROXY:-}
  AGIR_BLOB_STORE: ${AGIR_BLOB_STORE:-file}
  AGIR_S3_BUCKET: ${AGIR_S3_BUCKET:-}
  AGIR_S3_REGION: ${AGIR_S3_REGION:-}
  AGIR_S3_ENDPOINT: ${AGIR_S3_ENDPOINT:-}
  AGIR_S3_PREFIX: ${AGIR_S3_PREFIX:-}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
  # Empty means the rule reader alone reads documents; no model is called.
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: agir
      POSTGRES_DB: agir
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agir -d agir"]
      interval: 3s
      retries: 30
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: ${AGIR_IMAGE:-agir:local}
    environment: *agir-env
    # The blob volume; with AGIR_BLOB_STORE=s3 it holds nothing that matters.
    volumes:
      - blobs:/data
    ports:
      - "127.0.0.1:${AGIR_HOST_PORT:-8787}:8787"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 5s
      retries: 30
    restart: unless-stopped

  worker:
    image: ${AGIR_IMAGE:-agir:local}
    command: ["node_modules/.bin/tsx", "apps/worker/src/main.ts"]
    environment: *agir-env
    volumes:
      - blobs:/data
    # The API applies the migrations; the worker starts once it answers, so the two never migrate at once.
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  blobs:
