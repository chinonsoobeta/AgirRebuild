<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // The theme before first paint; the same rules as src/theme.ts.
      try {
        var p = localStorage.getItem("agir.theme");
        var dark = p === "dark" || (p === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      } catch (e) {
        document.documentElement.dataset.theme = "light";
      }
    </script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Agir</title>
  </head>
  <body>
    <!-- What shows before the code arrives (QA item 9): the name and the landing headline, in the words of
         src/strings/landing.ts. It sits beside #root, so React's first (empty) commit does not clear it; main.tsx removes it
         once the first screen is drawn. test/ui-landing.test.ts keeps the words in step. -->
    <div id="boot">
      <div class="landing" aria-busy="true">
        <header class="topbar"><div class="ld-bar ld-bar-full"><span class="brand"><span class="brand-mark"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 18L12 5l8 13" /><path d="M8 18h8" /></svg></span>Agir</span></div></header>
        <main class="ld-wrap"><section class="ld-hero"><div><h1 class="ld-h1">Decide whether to build, with numbers a lender can check.</h1><p class="ld-sub">Agir takes a small Canadian project from your documents to a build decision, a lender package and a partner memo. Every figure comes from one engine and keeps its source. Nothing is guessed.</p></div></section></main>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
